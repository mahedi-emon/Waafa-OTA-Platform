version: 2
updates:
  # Grouped weekly updates; majors are reviewed by hand (Next, React, Tailwind, Motion and Prisma move fast).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["type: chore", "area: infra"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    commit-message:
      prefix: "chore(ci)"
    labels: ["type: chore", "area: infra"]
    groups:
      actions:
        patterns: ["*"]
