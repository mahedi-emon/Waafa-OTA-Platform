name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  # Docs-only changes skip the app jobs (they report "skipped", which branch protection accepts).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "apps/**"
              - "packages/**"
              - "fixtures/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "prettier.config.mjs"
              - "commitlint.config.mjs"
              - "lint-staged.config.mjs"
              - ".github/workflows/ci.yml"
              - "deploy/**"
              - ".dockerignore"

  # The owner is the only author: no co-author trailer or AI attribution in commits, PR title or body.
  attribution:
    name: Authorship and attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Commits (message and author)
        run: node scripts/check-attribution.mjs --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
      # Dependabot bodies quote upstream changelogs, so only human PRs get the text check.
      - name: Pull request title and body
        if: github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-attribution.mjs --text "$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY")"

  # Component rules and compliance (scripts/guards.mjs): no install needed, runs on every change.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/guards.mjs

  verify:
    name: Lint, typecheck, test, build, e2e smoke
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The API tests run against a real PostgreSQL (B1).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waafa
          POSTGRES_PASSWORD: waafa
          POSTGRES_DB: waafa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waafa" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Builds include the dev-only /styleguide so e2e can check every component (CI builds are never deployed).
      STYLEGUIDE: "1"
      API_TEST_DATABASE_URL: postgresql://waafa:waafa@localhost:5432/waafa_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/**/src/**', 'fixtures/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @waafa/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: pnpm --filter @waafa/web exec playwright install --with-deps chromium

      - name: E2E smoke tests (390 and 1440 px, axe)
        run: pnpm e2e

      # A22 QA (#22): every public route at five widths; screenshots at 390 and 1440 for the design review.
      - name: Public screens at five widths
        working-directory: apps/web
        env:
          PUBLIC_SHOTS: "1"
        run: pnpm exec playwright test e2e/public-screens.spec.ts --workers=3

      - name: Upload public screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-screens
          path: apps/web/test-results/public-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # API mode end to end: PostgreSQL, the API (migrate, seed, start), the web built against it, admin flows (C1, A18).
  integration:
    name: API mode e2e (web on the API, admin)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waafa
          POSTGRES_PASSWORD: waafa
          POSTGRES_DB: waafa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waafa" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://waafa:waafa@localhost:5432/waafa
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789-abcdef
      REVALIDATE_SECRET: ci-revalidate-secret-0123456789-abc
      INTAKE_KEY: ci-intake-key-0123456789-abcdef
      WEB_ORIGINS: http://localhost:3100
      WEB_REVALIDATE_URL: http://localhost:3100/api/revalidate
      STAFF_ALERT_EMAIL: desk@example.com
      SEED_ADMIN_EMAIL: owner@example.com
      SEED_ADMIN_PASSWORD: ci-owner-password-123
      PROVIDER_SECRET_KEY: ci-provider-secret-key-0123456789-abcdef
      WAAFA_API_URL: http://localhost:4000
      WAAFA_INTAKE_KEY: ci-intake-key-0123456789-abcdef
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Database (migrate and seed)
        run: |
          pnpm --filter @waafa/api generate
          pnpm --filter @waafa/api migrate
          pnpm --filter @waafa/api seed

      - name: Start the API
        run: |
          nohup pnpm --filter @waafa/api start > api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:4000/ready > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Build the web on the API
        run: pnpm --filter @waafa/web... build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @waafa/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: pnpm --filter @waafa/web exec playwright install --with-deps chromium

      - name: API mode e2e
        working-directory: apps/web
        run: pnpm exec playwright test e2e/api-mode.spec.ts e2e/admin-shell.spec.ts e2e/admin-screens.spec.ts e2e/admin-editor.spec.ts e2e/admin-media.spec.ts e2e/admin-workflow.spec.ts e2e/admin-datatable.spec.ts e2e/admin-inbox.spec.ts e2e/admin-website.spec.ts e2e/admin-editors.spec.ts e2e/admin-settings.spec.ts e2e/admin-staff-tasks.spec.ts --workers=1

      - name: Upload admin screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-screens
          path: apps/web/test-results/admin-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: API log
        if: failure()
        run: tail -200 api.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api-mode
          path: apps/web/playwright-report
          retention-days: 7

  # The VPS stack exactly as deploy/deploy.sh runs it: images built, PostgreSQL, Redis, API, worker, web, nginx (C3).
  vps:
    name: VPS deploy smoke (Docker Compose)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Settings generator (deploy/init-env.sh)
        run: |
          sh deploy/init-env.sh example.com ops@example.com
          grep -Eq '^JWT_SECRET=[A-Za-z0-9]{48}$' deploy/.env
          grep -Eq '^SITE_URL=https://example.com$' deploy/.env
          [ "$(stat -c %a deploy/.env)" = "600" ]
          ! sh deploy/init-env.sh example.com ops@example.com
          rm deploy/.env

      - name: Test settings
        run: |
          cat > deploy/.env <<'ENV'
          SITE_URL=http://localhost
          SITE_DOMAIN=localhost
          ACME_EMAIL=
          POSTGRES_PASSWORD=ciPostgresPassword0123456789abcdef
          JWT_SECRET=ci-jwt-secret-0123456789-0123456789-abcdef
          REVALIDATE_SECRET=ci-revalidate-secret-0123456789-abc
          INTAKE_KEY=ci-intake-key-0123456789-abcdef
          SMTP_URL=smtp://127.0.0.1:2525
          MAIL_FROM=Waafa <no-reply@example.com>
          STAFF_ALERT_EMAIL=desk@example.com
          SEED_ADMIN_EMAIL=owner@example.com
          SEED_ADMIN_PASSWORD=ci-owner-password-123
          ENV

      - name: Deploy
        run: sh deploy/deploy.sh

      - name: Site answers through nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost/robots.txt > /dev/null; then break; fi
            sleep 2
          done
          for path in / /flights /tour-packages /visa /shop /contact /faqs /secure-admin-control/sign-in /sitemap.xml; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost$path")
            echo "$path $status"
            [ "$status" = "200" ] || exit 1
          done
          curl -s http://localhost/ | grep -q "Waafa"
          # #85: the old admin path is a 404 behind nginx too.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/admin)" = "404" ]
          docker compose -f deploy/compose.yml ps

      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail 150

  lighthouse:
    name: Lighthouse CI (mobile)
    needs: [changes, verify]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Runs once the home page exists (A7 adds apps/web/lighthouserc.json).
      - name: Detect Lighthouse config
        id: lh
        run: |
          if [ -f apps/web/lighthouserc.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Lighthouse skipped::apps/web/lighthouserc.json not present yet."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.lh.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.lh.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.lh.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web
        if: steps.lh.outputs.ready == 'true'
        run: pnpm --filter @waafa/web... build

      # Mobile (Lighthouse default), one run per route; budgets warn for now and the scores land in the summary (#22).
      - name: Lighthouse CI
        if: steps.lh.outputs.ready == 'true'
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Lighthouse scores
        if: always() && steps.lh.outputs.ready == 'true'
        working-directory: apps/web
        run: node ../../scripts/lighthouse-summary.mjs lhci-report

      - name: Upload Lighthouse reports
        if: always() && steps.lh.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/lhci-report
          retention-days: 7
          if-no-files-found: ignore
