name: CI

# CI budget (issue 231): the repository is private, so every job minute is billed against the monthly allowance.
# - A normal pull request runs the quick set: guards, attribution, format, lint, typecheck, unit tests, build and one
#   smoke e2e (about 10 minutes).
# - The full suite (all e2e, public screens at five widths, API-mode e2e on the compiled API, VPS deploy smoke,
#   Lighthouse and CodeQL) runs on pushes to main, nightly, by hand, and on pull requests labelled `full-ci`.
# - Pull requests that touch the database schema, deploy/, sign-in, payments, checkout or lead intake must carry the
#   `full-ci` label; adding the label re-runs CI in full (.github/workflows/full-ci-label.yml).
# - On main, the "Docker images" workflow builds and checks the same Compose stack, so the VPS smoke here runs only on
#   labelled pull requests and at night.
# - The nightly run skips itself when main's latest commit already passed a push run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02:30 Asia/Dhaka.
    - cron: "30 20 * * *"
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces; the nightly run has its own group.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  # What changed, and whether this run is the quick set or the full suite.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.mode.outputs.run }}
      full: ${{ steps.mode.outputs.full }}
      risky: ${{ steps.filter.outputs.risky }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - "apps/**"
              - "packages/**"
              - "fixtures/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "prettier.config.mjs"
              - "commitlint.config.mjs"
              - "lint-staged.config.mjs"
              - ".github/workflows/ci.yml"
              - ".github/codeql/**"
              - "deploy/**"
              - ".dockerignore"
            risky:
              - "apps/api/prisma/**"
              - "deploy/**"
              - "apps/api/Dockerfile"
              - "apps/api/src/auth/**"
              - "apps/api/src/customers/**"
              - "apps/api/src/public/**"
              - "apps/api/src/payments/**"
              - "apps/web/src/proxy.ts"
              - "apps/web/src/app/api/**"
              - "apps/web/src/app/*/[(]site[)]/login/**"
              - "apps/web/src/app/*/[(]site[)]/account/**"
              - "apps/web/src/app/*/[(]site[)]/shop/checkout/**"
              - "apps/web/src/app/*/[(]site[)]/offline-payment/**"
              - "apps/web/src/app/*/secure-admin-control/sign-in/**"
              - "apps/web/src/lib/account/**"
              - "apps/web/src/lib/leads/**"
              - "apps/web/src/lib/security/**"
              - "apps/web/src/components/leads/**"
              - "apps/web/src/components/shop/Checkout*"
              - "apps/web/src/components/shop/Payment*"
      - name: Quick set or full suite
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=true
          full=false
          case "$EVENT" in
            pull_request)
              run=$CODE
              # Read the labels now, not from the event: a re-run after the label was added must see it.
              if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'full-ci'; then full=true; fi
              ;;
            schedule)
              full=true
              passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
              if [ "${passed:-0}" -gt 0 ]; then
                run=false
                echo "::notice title=Nightly skipped::main's latest commit already passed CI."
              fi
              ;;
            *) full=true ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Run: $run · full suite: $full"

  # The owner is the only author: no co-author trailer or AI attribution in commits, PR title or body.
  attribution:
    name: Authorship and attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Commits (message and author)
        run: node scripts/check-attribution.mjs --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
      # Dependabot bodies quote upstream changelogs, so only human PRs get the text check.
      - name: Pull request title and body
        if: github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-attribution.mjs --text "$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY")"

  # Component rules and compliance (scripts/guards.mjs): no install needed, runs on every change.
  guards:
    name: Guards
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/guards.mjs
      # No server-only module (LocalLink, next-intl/server) inside a Client Component's imports (issue 236).
      - run: node apps/web/scripts/client-boundary.mjs

  verify:
    name: Lint, typecheck, test, build, e2e smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The API tests run against a real PostgreSQL (B1) and Redis (shared rate limits, issue 234).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waafa
          POSTGRES_PASSWORD: waafa
          POSTGRES_DB: waafa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waafa" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Builds include the dev-only /styleguide so e2e can check every component (CI builds are never deployed).
      STYLEGUIDE: "1"
      API_TEST_DATABASE_URL: postgresql://waafa:waafa@localhost:5432/waafa_test
      API_TEST_REDIS_URL: redis://localhost:6379
      FULL: ${{ needs.changes.outputs.full }}
      # The full suite never replays cached task results.
      TURBO_FORCE: ${{ needs.changes.outputs.full == 'true' && 'true' || '' }}
    steps:
      - name: full-ci label (schema, deploy, sign-in, payments, checkout, lead intake)
        if: github.event_name == 'pull_request' && needs.changes.outputs.risky == 'true' && needs.changes.outputs.full != 'true'
        run: |
          echo "::error title=full-ci label required::This pull request touches the database schema, deploy/, sign-in, payments, checkout or lead intake. Add the full-ci label; CI then runs in full."
          exit 1

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Turborepo replays lint, typecheck and test results for packages whose inputs did not change.
      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Issue 236: Server Components draw lucide icons on the server (needs node_modules, so not in the guards job).
      - name: Server icons
        run: node apps/web/scripts/server-icons.mjs --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/**/src/**', 'fixtures/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @waafa/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: pnpm --filter @waafa/web exec playwright install --with-deps chromium

      # Firefox and WebKit for the cross-browser run (NFR-COMP, issue 259), full suite only.
      - name: Install Firefox and WebKit
        if: env.FULL == 'true'
        run: pnpm --filter @waafa/web exec playwright install --with-deps firefox webkit

      - name: E2E smoke (home at five widths, axe, keyboard)
        if: env.FULL != 'true'
        working-directory: apps/web
        run: pnpm exec playwright test e2e/smoke.spec.ts

      - name: E2E full (390 and 1440 px, axe)
        if: env.FULL == 'true'
        working-directory: apps/web
        run: pnpm exec playwright test

      # The key visitor flows in Firefox and WebKit (NFR-COMP, issue 259).
      - name: E2E Firefox and WebKit (key flows)
        if: env.FULL == 'true'
        working-directory: apps/web
        env:
          CROSS_BROWSER: "1"
        run: pnpm exec playwright test --project=firefox --project=webkit --workers=2

      # A22 QA (#22): every public route at five widths; screenshots at 390 and 1440 for the design review.
      - name: Public screens at five widths
        if: env.FULL == 'true'
        working-directory: apps/web
        env:
          PUBLIC_SHOTS: "1"
        run: pnpm exec playwright test e2e/public-screens.spec.ts --workers=3

      - name: Upload public screenshots
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: public-screens
          path: apps/web/test-results/public-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # API mode end to end: PostgreSQL, the compiled API (migrate, seed, start), the web built against it, admin flows.
  integration:
    name: API mode e2e (web on the API, admin)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waafa
          POSTGRES_PASSWORD: waafa
          POSTGRES_DB: waafa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waafa" --health-interval 5s --health-timeout 5s --health-retries 12
      # A test inbox (issue 241): the API sends through it and the sign-in e2e reads the emailed code from its API.
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://waafa:waafa@localhost:5432/waafa
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: Waafa <no-reply@example.com>
      MAILPIT_URL: http://localhost:8025
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789-abcdef
      REVALIDATE_SECRET: ci-revalidate-secret-0123456789-abc
      INTAKE_KEY: ci-intake-key-0123456789-abcdef
      WEB_ORIGINS: http://localhost:3100
      WEB_REVALIDATE_URL: http://localhost:3100/api/revalidate
      STAFF_ALERT_EMAIL: desk@example.com
      SEED_ADMIN_EMAIL: owner@example.com
      SEED_ADMIN_PASSWORD: ci-owner-password-123
      PROVIDER_SECRET_KEY: ci-provider-secret-key-0123456789-abcdef
      # Many e2e forms come from one address and one phone number (issue 234).
      RATE_LIMIT_FACTOR: "50"
      WAAFA_API_URL: http://localhost:4000
      WAAFA_INTAKE_KEY: ci-intake-key-0123456789-abcdef
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same compiled files the production image runs (issue 231).
      - name: Compile the API
        run: |
          pnpm --filter @waafa/api generate
          node apps/api/scripts/build.mjs

      # The image's own migration runner (issue 303), not the Prisma CLI.
      - name: Database (migrate and seed)
        working-directory: apps/api
        run: |
          node dist/migrate.js
          node dist/seed.js

      - name: Start the API
        working-directory: apps/api
        run: |
          nohup node dist/main.js > ../../api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:4000/ready > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          cat ../../api.log
          exit 1

      - name: Build the web on the API
        run: pnpm --filter @waafa/web... build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @waafa/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: pnpm --filter @waafa/web exec playwright install --with-deps chromium

      - name: API mode e2e
        working-directory: apps/web
        run: pnpm exec playwright test e2e/api-mode.spec.ts e2e/admin-shell.spec.ts e2e/admin-screens.spec.ts e2e/admin-dark.spec.ts e2e/admin-editor.spec.ts e2e/admin-media.spec.ts e2e/admin-workflow.spec.ts e2e/admin-datatable.spec.ts e2e/admin-inbox.spec.ts e2e/admin-website.spec.ts e2e/admin-editors.spec.ts e2e/admin-settings.spec.ts e2e/admin-staff-tasks.spec.ts e2e/admin-two-step.spec.ts e2e/admin-alerts.spec.ts e2e/admin-customers.spec.ts e2e/admin-reviews.spec.ts e2e/admin-imports.spec.ts e2e/admin-integrations-guide.spec.ts e2e/account-email.spec.ts e2e/account-sections.spec.ts --workers=1

      - name: Upload admin screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-screens
          path: apps/web/test-results/admin-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: API log
        if: failure()
        run: tail -200 api.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api-mode
          path: apps/web/playwright-report
          retention-days: 7

  # The VPS stack exactly as deploy/deploy.sh runs it: images built, PostgreSQL, Redis, API, worker, web, nginx (C3).
  # On main the "Docker images" workflow does the same build and checks, so this job runs on labelled PRs and nightly.
  vps:
    name: VPS deploy smoke (Docker Compose)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The upgrade rehearsal checks out the live release (deploy/LIVE_RELEASE) beside this one.
          fetch-depth: 0

      - name: Settings generator (deploy/init-env.sh)
        run: |
          sh deploy/init-env.sh example.com ops@example.com
          grep -Eq '^JWT_SECRET=[A-Za-z0-9]{48}$' deploy/.env
          grep -Eq '^SITE_URL=https://example.com$' deploy/.env
          [ "$(stat -c %a deploy/.env)" = "600" ]
          ! sh deploy/init-env.sh example.com ops@example.com
          rm deploy/.env

      - name: Test settings
        run: |
          cat > deploy/.env <<'ENV'
          SITE_URL=http://localhost
          SITE_DOMAIN=localhost
          ACME_EMAIL=
          POSTGRES_PASSWORD=ciPostgresPassword0123456789abcdef
          JWT_SECRET=ci-jwt-secret-0123456789-0123456789-abcdef
          REVALIDATE_SECRET=ci-revalidate-secret-0123456789-abc
          INTAKE_KEY=ci-intake-key-0123456789-abcdef
          SMTP_URL=smtp://127.0.0.1:2525
          MAIL_FROM=Waafa <no-reply@example.com>
          STAFF_ALERT_EMAIL=desk@example.com
          SEED_ADMIN_EMAIL=owner@example.com
          SEED_ADMIN_PASSWORD=ci-owner-password-123
          ENV

      # Issue 285: start the release live on the server, add a lead and an order, deploy this commit over it and check
      # nothing was lost; the smoke steps below then run on the upgraded stack.
      - name: Upgrade rehearsal (live release → this commit)
        run: sh scripts/upgrade-rehearsal.sh

      - name: Site answers through nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost/robots.txt > /dev/null; then break; fi
            sleep 2
          done
          for path in / /flights /tour-packages /visa /shop /contact /faqs /secure-admin-control/sign-in /sitemap.xml; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost$path")
            echo "$path $status"
            [ "$status" = "200" ] || exit 1
          done
          curl -s http://localhost/ | grep -q "Waafa"
          # Issue 332: Brotli where the browser accepts it, gzip otherwise.
          curl -s -H 'Accept-Encoding: br, gzip' -o /dev/null -D - http://localhost/ | grep -qi '^content-encoding: br'
          curl -s -H 'Accept-Encoding: gzip' -o /dev/null -D - http://localhost/ | grep -qi '^content-encoding: gzip'
          # #85: the old admin path is a 404 behind nginx too.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/admin)" = "404" ]
          # The worker runs the compiled file (issue 231).
          docker compose -f deploy/compose.yml ps
          [ "$(docker compose -f deploy/compose.yml ps -q worker | xargs docker inspect -f '{{.State.Running}}')" = "true" ]

      # Issue 332: Brotli, HTTP/2, HSTS and the HTTP/3 advert on the HTTPS site, with a throwaway certificate.
      - name: nginx HTTPS (test certificate)
        run: sh scripts/nginx-https-check.sh

      # Issue 235: the worker scans customer files with ClamAV; a clean PDF turns "clean", the EICAR test file
      # "infected" and moves to quarantine/. ClamAV loads its signatures first (a minute or two).
      - name: Malware scan (ClamAV, EICAR)
        run: |
          keys=$(docker compose -f deploy/compose.yml exec -T api node --input-type=module - < scripts/smoke-malware-scan.mjs | tail -1)
          clean=${keys% *}; infected=${keys#* }
          echo "clean=$clean infected=$infected"
          status() {
            docker compose -f deploy/compose.yml exec -T postgres psql -U waafa -d waafa -tAc \
              "SELECT \"scanStatus\" || ' ' || \"path\" FROM \"CustomerFile\" WHERE \"storageKey\" = '$1'"
          }
          for attempt in $(seq 1 60); do
            a=$(status "$clean"); b=$(status "$infected")
            echo "$attempt: $a | $b"
            case "$a" in unscanned*) ;; *) case "$b" in unscanned*) ;; *) break ;; esac ;; esac
            sleep 5
          done
          case "$(status "$clean")" in clean*) ;; *) echo "clean file not marked clean"; exit 1 ;; esac
          case "$(status "$infected")" in "infected quarantine/"*) ;; *) echo "EICAR file not quarantined"; exit 1 ;; esac
          docker compose -f deploy/compose.yml logs --tail 20 worker

      # Issue 239: deploy.sh installed the backup cron; a backup and the restore drill run here.
      - name: Backups (cron, backup, restore drill)
        run: |
          crontab -l | grep -q "sh backup.sh >> backups/backup.log 2>&1 # waafa-backup"
          crontab -l | grep -q "sh backup.sh --drill >> backups/drill.log 2>&1 # waafa-backup"
          sh deploy/backup.sh
          # Issue 332: an archive identical to the day before becomes a hard link to it.
          media=$(ls -1 deploy/backups/waafa-*.media.tar.gz | sort | tail -n 1)
          cp "$media" deploy/backups/waafa-20000101-0000.media.tar.gz
          sh deploy/backup.sh
          media=$(ls -1 deploy/backups/waafa-*.media.tar.gz | sort | tail -n 1)
          [ "$(stat -c %h "$media")" -ge 2 ]
          ls -li deploy/backups
          sh deploy/backup.sh --drill | tee /dev/stderr | grep -q "drill ok"

      # Issue 303: image sizes, revision labels and the memory of every container, against their budgets.
      - name: Image sizes and memory
        run: sh scripts/measure-stack.sh

      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail 150

  lighthouse:
    name: Lighthouse CI (mobile)
    needs: [changes, verify]
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @waafa/web... build

      # Lighthouse 13 on the 11 key routes, median of 5 after a warm-up (issues 236, 257): budgets in
      # apps/web/lighthouse.config.json fail the job, targets are warnings (D298, D328).
      - name: Lighthouse
        run: node scripts/lighthouse-run.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/lighthouse-report
          retention-days: 7
          if-no-files-found: ignore

  # CodeQL (security-extended) with the full suite. The repository is private, so results are read here instead of
  # uploaded and a finding fails the check (D205).
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: ${{ github.event.repository.private && 'false' || 'true' }}
          output: codeql-results
      - name: Findings
        run: node scripts/codeql-findings.mjs codeql-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 7
          if-no-files-found: ignore
