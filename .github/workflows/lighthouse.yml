# Lighthouse on demand (issue 236): the same Lighthouse CI run as the CI job, on any branch, without the rest of the
# suite. Speed work measures here between commits; the CI job stays the gate on main, nightly and full-ci PRs.
name: Lighthouse (manual)

on:
  workflow_dispatch:
  # Speed branches measure on every push (a dispatch needs the workflow on main first).
  push:
    branches: ["perf/**", "chore/*-speed"]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lighthouse:
    name: Lighthouse CI (mobile, manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @waafa/web... build

      - name: Lighthouse CI
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Lighthouse scores
        if: always()
        working-directory: apps/web
        run: node ../../scripts/lighthouse-summary.mjs lhci-report

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-manual
          path: apps/web/lhci-report
          retention-days: 7
          if-no-files-found: ignore
