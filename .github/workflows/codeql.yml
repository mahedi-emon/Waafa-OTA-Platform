name: CodeQL

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      # Code scanning on a private repository needs GitHub Code Security (a paid add-on). The analysis runs anyway:
      # its results are read below instead of uploaded, so a finding still fails the check (D205, replaces D192).
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - name: Findings
        run: node scripts/codeql-findings.mjs codeql-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 7
          if-no-files-found: ignore
