name: CodeQL

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript and TypeScript)
    # Code scanning on a private repository needs GitHub Code Security (a paid add-on), so while the repository is
    # private the job is skipped instead of failing at upload after minutes of analysis (D192). It runs again by
    # itself once the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
